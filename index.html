<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1320" />
    <title>Estaciones Cantolao</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <header class="topbar">
        <div>
          <strong>RED OPERADORA CANTOLAO</strong>
          <span>118 estaciones</span>
        </div>
        <button id="locateBtn" class="icon-button" type="button" aria-label="Usar mi ubicación">◎</button>
      </header>

      <section id="statusCard" class="status-card">
        <div id="statusIcon" class="status-icon">📍</div>
        <div class="status-copy">
          <span id="statusEyebrow">Ubicación</span>
          <strong id="statusTitle">Buscando tu ubicación…</strong>
          <span id="statusSubtitle">Permite el acceso a la ubicación para encontrar la estación más cercana.</span>
        </div>
      </section>

      <section id="nearestCard" class="nearest-card hidden">
        <div class="nearest-head">
          <div>
            <span class="eyebrow">ESTACIÓN MÁS CERCANA</span>
            <h1 id="nearestName">—</h1>
          </div>
          <div id="nearestDistance" class="distance">—</div>
        </div>
        <div class="actions">
          <button id="centerNearestBtn" class="secondary" type="button">Ver estación</button>
          <a id="navigateBtn" class="primary" href="#" target="_blank" rel="noopener">Cómo llegar</a>
        </div>
      </section>

      <div id="fatal" class="fatal hidden"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
