<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1320" />
    <title>Estaciones Cantolao</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <header class="topbar">
        <div>
          <strong>RED OPERADORA CANTOLAO</strong>
          <span>118 estaciones</span>
        </div>
        <button id="locateBtn" class="icon-button" type="button" aria-label="Usar mi ubicación">◎</button>
      </header>

      <section id="statusCard" class="status-card">
        <div id="statusIcon" class="status-icon">📍</div>
        <div class="status-copy">
          <span id="statusEyebrow">Ubicación</span>
          <strong id="statusTitle">Buscando tu ubicación…</strong>
          <span id="statusSubtitle">Permite el acceso a la ubicación para encontrar la estación más cercana.</span>
        </div>
      </section>

      <section id="nearestCard" class="nearest-card hidden">
        <div class="nearest-head">
          <div>
            <span class="eyebrow">ESTACIÓN MÁS CERCANA</span>
            <h1 id="nearestName">—</h1>
          </div>
          <div id="nearestDistance" class="distance">—</div>
        </div>
        <div class="actions">
          <button id="centerNearestBtn" class="secondary" type="button">Ver estación</button>
          <button id="navigateBtn" class="primary" type="button">Cómo llegar</button>
        </div>
      </section>

      <div id="navBackdrop" class="nav-backdrop hidden"></div>
      <section id="navSheet" class="nav-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="navTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <div>
            <span class="eyebrow">ABRIR NAVEGACIÓN</span>
            <h2 id="navTitle">Elige una aplicación</h2>
            <p id="navStationName">—</p>
          </div>
          <button id="closeNavBtn" class="close-button" type="button" aria-label="Cerrar">×</button>
        </div>
        <div class="nav-options">
          <a id="googleMapsNav" class="nav-option" href="#" target="_blank" rel="noopener">
            <span class="nav-option-icon google-option">G</span>
            <span><strong>Google Maps</strong><small>Abrir navegación hasta la estación</small></span>
            <b>›</b>
          </a>
          <a id="wazeNav" class="nav-option" href="#" target="_blank" rel="noopener">
            <span class="nav-option-icon waze-option">W</span>
            <span><strong>Waze</strong><small>Abrir la ruta en Waze</small></span>
            <b>›</b>
          </a>
        </div>
      </section>

      <div id="fatal" class="fatal hidden"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
